<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#030511" />
    <title>별볼일</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #030511;
        color: #f5f2e9;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #b9bfd0;
        font-size: 15px;
        line-height: 1.7;
        max-width: 32ch;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 600;
        background: #fbd276;
        color: #030511;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>예보는 금방 바뀌어서 지난 추천을 남겨 두지 않아요. 연결된 뒤에 다시 열어 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
